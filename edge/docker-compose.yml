services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: uvls-edge
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      SERVER_API_URL: ${SERVER_API_URL:-http://uvls-app/api/receive_reading.php}
      EDGE_API_KEY: ${EDGE_API_KEY:-changeme}
      CONFIG_PATH: /app/config.json
    volumes:
      - ./app:/app/app
      - ./gauge_reader:/app/gauge_reader
      - ./config.json:/app/config.json
      - ./version.txt:/app/version.txt:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /root/opcv-1:/repo
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/local/lib/docker/cli-plugins/docker-compose:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    networks:
      - uvls-net

  redirect:
    image: nginx:alpine
    container_name: uvls-edge-redirect
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - uvls-net

networks:
  uvls-net:
    external: true
